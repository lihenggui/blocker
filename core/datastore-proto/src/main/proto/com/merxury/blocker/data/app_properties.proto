syntax = "proto3";

option java_package = "com.merxury.blocker.core.datastore";
option java_multiple_files = true;

message AppProperties {
  // Old fields retained so the app properties migration can clear them on disk.
  bool component_database_initialized = 1;
  bool general_rule_database_initialized = 2;
  string last_opened_app_list_hash = 3;
  reserved 4;
  reserved "last_opened_rule_hash";
  // True when su last started a root process, false when it refused, absent before a decision.
  optional bool root_grant_remembered = 5;
  // Whether the record of components Blocker disabled through PackageManager has been seeded once
  // from the component list of earlier versions. Set also when there was nothing to seed.
  bool pm_block_records_seeded = 6;
  // Wall-clock time of the last successful catalog check, in epoch milliseconds.
  int64 last_catalog_synced_epoch_ms = 7;
  // Rule server provider used for the last successful catalog check.
  string last_catalog_synced_provider = 8;
}
